---
layout: default
---
<header class="hero">
  <picture>
    <source srcset="{{ '/assets/img/logo-dark.png' | relative_url }}" media="(prefers-color-scheme: dark)">
    <img src="{{ '/assets/img/logo-light.png' | relative_url }}" alt="SC26 Chicago, IL — hpc unites." width="332" height="156">
  </picture>
  <h1>{{ site.title }} Notes</h1>
</header>
<table>
<thead><tr><th>Notes</th></tr></thead>
<tbody>
{% assign notes = site.pages | sort: "name" %}
{% for n in notes %}{% if n.name contains ".md" and n.url != "/" %}
<tr><td><a href="{{ n.url | relative_url }}">{{ n.name | remove: ".md" }}</a></td></tr>
{% endif %}{% endfor %}
</tbody>
</table>
